name: Build Custom RustDesk Client

on:
  workflow_dispatch:

env:
  RENDEZVOUS_SERVER: "rd.itwonline.ru"
  CUSTOM_KEY: "uIyvAIIqKmt8sZWuKEfkfxGnm9U1iWxOtxcafU32Sko="

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout RustDesk with submodules
        run: git clone --recursive https://github.com/rustdesk/rustdesk.git .
      
      - name: Patch config.rs (server + key)
        shell: pwsh
        run: |
          $file = "libs/hbb_common/src/config.rs"
          (Get-Content $file) -replace 'const RENDEZVOUS_SERVER: &str = ".*";', 'const RENDEZVOUS_SERVER: &str = "$env:RENDEZVOUS_SERVER";' | Set-Content $file
          (Get-Content $file) -replace 'const DEFAULT_KEY: &str = ".*";', 'const DEFAULT_KEY: &str = "$env:CUSTOM_KEY";' | Set-Content $file
          Write-Host "✓ Patched with server: $env:RENDEZVOUS_SERVER"
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
      
      - name: Install libraries via vcpkg (CLASSIC MODE)
        run: |
          C:\vcpkg\vcpkg install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
      
      - name: Install Rust targets
        run: |
          rustup target add x86_64-pc-windows-msvc
      
      - name: Build RustDesk
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --target x86_64-pc-windows-msvc
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKGRS_DYNAMIC: 0
      
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: target/x86_64-pc-windows-msvc/release/rustdesk.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RustDesk with submodules
        run: git clone --recursive https://github.com/rustdesk/rustdesk.git .
      
      - name: Patch config.rs
        run: |
          sed -i 's|const RENDEZVOUS_SERVER: &str = ".*";|const RENDEZVOUS_SERVER: &str = "${{ env.RENDEZVOUS_SERVER }}";|' libs/hbb_common/src/config.rs
          sed -i 's|const DEFAULT_KEY: &str = ".*";|const DEFAULT_KEY: &str = "${{ env.CUSTOM_KEY }}";|' libs/hbb_common/src/config.rs
          echo "✓ Patched with server: ${{ env.RENDEZVOUS_SERVER }}"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-randr0-dev libxdo-dev libxfixes-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libpulse-dev libclang-dev \
            libva-dev libgtk-3-dev libglib2.0-dev ninja-build
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=~/vcpkg" >> $GITHUB_ENV
      
      - name: Install libraries via vcpkg (Linux)
        run: |
          ~/vcpkg/vcpkg install --classic libvpx libyuv opus aom
      
      - name: Build RustDesk
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --release
        env:
          VCPKG_ROOT: ~/vcpkg
      
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux
          path: target/release/rustdesk

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout RustDesk with submodules
        run: git clone --recursive https://github.com/rustdesk/rustdesk.git .
      
      - name: Patch config.rs
        run: |
          sed -i '' 's|const RENDEZVOUS_SERVER: &str = ".*";|const RENDEZVOUS_SERVER: &str = "${{ env.RENDEZVOUS_SERVER }}";|' libs/hbb_common/src/config.rs
          sed -i '' 's|const DEFAULT_KEY: &str = ".*";|const DEFAULT_KEY: &str = "${{ env.CUSTOM_KEY }}";|' libs/hbb_common/src/config.rs
          echo "✓ Patched with server: ${{ env.RENDEZVOUS_SERVER }}"
      
      - name: Install dependencies
        run: |
          brew install cmake nasm ninja llvm
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=~/vcpkg" >> $GITHUB_ENV
      
      - name: Install libraries via vcpkg (macOS)
        run: |
          ~/vcpkg/vcpkg install --classic libvpx libyuv opus aom
      
      - name: Build RustDesk
        run: |
          cargo build --release
        env:
          VCPKG_ROOT: ~/vcpkg
      
      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos
          path: target/release/rustdesk
