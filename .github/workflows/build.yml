name: Build Custom RustDesk Client (Full GUI)

on:
  workflow_dispatch:

env:
  RENDEZVOUS_SERVER: "rd.itwonline.ru"
  CUSTOM_KEY: "uIyvAIIqKmt8sZWuKEfkfxGnm9U1iWxOtxcafU32Sko="

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout RustDesk with submodules
        run: |
          git clone --recursive https://github.com/rustdesk/rustdesk.git .
          git submodule update --init --recursive
      
      - name: Patch config.rs (server + key)
        shell: pwsh
        run: |
          $file = "libs/hbb_common/src/config.rs"
          (Get-Content $file) -replace 'const RENDEZVOUS_SERVER: &str = ".*";', 'const RENDEZVOUS_SERVER: &str = "$env:RENDEZVOUS_SERVER";' | Set-Content $file
          (Get-Content $file) -replace 'const DEFAULT_KEY: &str = ".*";', 'const DEFAULT_KEY: &str = "$env:CUSTOM_KEY";' | Set-Content $file
          Write-Host "Patched with server: $env:RENDEZVOUS_SERVER"
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:\vcpkg" >> %GITHUB_ENV%
      
      - name: Install libraries via vcpkg
        run: |
          cd C:\vcpkg
          vcpkg install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Rust dependencies
        run: |
          cargo install flutter_rust_bridge_codegen
          rustup target add x86_64-pc-windows-msvc
      
      - name: Setup Flutter dependencies
        run: |
          cd flutter
          flutter pub get
          flutter pub run flutter_rust_bridge:generate
          cd ..
      
      - name: Build RustDesk
        run: |
          python build.py --flutter --portable
        env:
          VCPKG_ROOT: C:\vcpkg
      
      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-portable
          path: target/release/rustdesk.exe
      
      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-installer
          path: target/release/rustdesk.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RustDesk with submodules
        run: |
          git clone --recursive https://github.com/rustdesk/rustdesk.git .
          git submodule update --init --recursive
      
      - name: Patch config.rs
        run: |
          sed -i 's|const RENDEZVOUS_SERVER: &str = ".*";|const RENDEZVOUS_SERVER: &str = "${{ env.RENDEZVOUS_SERVER }}";|' libs/hbb_common/src/config.rs
          sed -i 's|const DEFAULT_KEY: &str = ".*";|const DEFAULT_KEY: &str = "${{ env.CUSTOM_KEY }}";|' libs/hbb_common/src/config.rs
          echo "Patched with server: ${{ env.RENDEZVOUS_SERVER }}"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-randr0-dev libxdo-dev libxfixes-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libpulse-dev libclang-dev \
            libva-dev libgtk-3-dev libglib2.0-dev ninja-build
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install Rust dependencies
        run: |
          cargo install flutter_rust_bridge_codegen
      
      - name: Setup Flutter dependencies
        run: |
          cd flutter
          flutter pub get
          flutter pub run flutter_rust_bridge:generate
          cd ..
      
      - name: Build RustDesk
        run: |
          python build.py --portable
      
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux
          path: target/release/rustdesk

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout RustDesk with submodules
        run: |
          git clone --recursive https://github.com/rustdesk/rustdesk.git .
          git submodule update --init --recursive
      
      - name: Patch config.rs
        run: |
          sed -i '' 's|const RENDEZVOUS_SERVER: &str = ".*";|const RENDEZVOUS_SERVER: &str = "${{ env.RENDEZVOUS_SERVER }}";|' libs/hbb_common/src/config.rs
          sed -i '' 's|const DEFAULT_KEY: &str = ".*";|const DEFAULT_KEY: &str = "${{ env.CUSTOM_KEY }}";|' libs/hbb_common/src/config.rs
          echo "Patched with server: ${{ env.RENDEZVOUS_SERVER }}"
      
      - name: Install dependencies
        run: |
          brew install cmake nasm ninja
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install Rust dependencies
        run: |
          cargo install flutter_rust_bridge_codegen
      
      - name: Setup Flutter dependencies
        run: |
          cd flutter
          flutter pub get
          flutter pub run flutter_rust_bridge:generate
          cd ..
      
      - name: Build RustDesk
        run: |
          python build.py --portable
      
      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos
          path: target/release/rustdesk
